            var isBulkSelecting = false;

            $("#selectAll").live("click", function () {
                var select = $(this).is(":checked");
                isBulkSelecting = true;
                $("#tblContent tr").each(function () {
                    setRowSelection($(this), select);
                });
                isBulkSelecting = false;
                updateSelectAllState(); // set final state after all rows processed
            });
            
            $("#tblContent tr").live('click', function() {
        	    var $row = $(this);
        	    var select = !$row.find("td:first img").is(":visible");
        	    setRowSelection($row, select);
        	});

            function setRowSelection($row, select) {
                var $checkImg = $row.find("td:first img");
                var isVisible = $checkImg.is(":visible");

                // Skip if already in desired state
                if ((select && isVisible) || (!select && !isVisible)) {
                    return;
                }

                var rowIndex = $("#tblContent tr").index($row);
                var custname = data[rowIndex][7];
                $('#txtname').val(custname);

                if (select) {
                    $checkImg.show();
                    $row.addClass('clicked');
                    dataRoutekey.push(eval(data[rowIndex][4]));
                    dataTranskey.push(eval(data[rowIndex][5]));
                    dataVisitkey.push(eval(data[rowIndex][6]));
                    countRecord++;
                } else {
                    $checkImg.hide();
                    $row.removeClass('clicked');
                    var removeRouteKey = eval(data[rowIndex][4]);
                    var removeTransKey = eval(data[rowIndex][5]);
                    var removeVisitkey = eval(data[rowIndex][6]);
                    dataRoutekey.splice($.inArray(removeRouteKey, dataRoutekey), 1);
                    dataTranskey.splice($.inArray(removeTransKey, dataTranskey), 1);
                    dataVisitkey.splice($.inArray(removeVisitkey, dataVisitkey), 1);
                    countRecord--;
                }

                if (!isBulkSelecting) {
                    updateSelectAllState();
                }
            }

            function updateSelectAllState() {
                var totalRows = $("#tblContent tr").length;
                var selectedRows = $("#tblContent tr.clicked").length;
                $("#selectAll").prop("checked", totalRows > 0 && selectedRows === totalRows);
            }

            //Bind data dynamically
            function BindData(result) {
			    var CellCount = $("#tblHeaderContent tr:eq(0) th").length;
			    data = result;
			
			    // Clear existing rows
			    $('#tblContent tbody').empty();
			
			    for (var i = 0; i < data.length; i++) {
			        var r = "<tr class='contentFont'>";
			        for (var j = 1; j <= CellCount; j++) {
			            var c = '';
			            var temp = (j == 2) ? 'class="leftAlign"' : "class='leftAlign last'";
			            if (j == 1) {
			                c = "<td><img src='../images/check_1.png' height='25' style='display:none;' id='check_" + (i + 1) + "' /></td>";
			            } else {
			                if (j == 3) data[i][j - 2] = parseInt(data[i][j - 2]);
			                if (j == 5) data[i][j - 2] = eval(data[i][j - 2]).toFixed(decimalplace);
			                c = "<td " + temp + ">" + data[i][j - 2] + "</td>";
			            }
			            r += c;
			        }
			        r += "</tr>";
			        $('#tblContent tbody').append(r);
			    }
			
			    $("#tblContent tr:odd").addClass('oddRow');
			    $("#tblContent tr:even").addClass('evenRow');
			}

                $("#tblContent tr:gt(0)").remove();
                $('#tblContent tbody').empty();
