	<script type="text/javascript" language="javascript">
		resizeOrientationWindow();
		$(document)
				.ready(
						function()
						{
							resizeWindow();

							$("#txtdeviceid").text(
									"DEVICE ID :"
											+ sessionStorage
													.getItem("DeviceID"));

							$(".leftfooter").html(getCurrentDate());

							var mydate = new Date();
							var theyear = mydate.getFullYear();
							var themonth = mydate.getMonth();
							var thetoday = mydate.getDate();
							var thehour = mydate.getHours();
							var theminut = mydate.getMinutes();
							var varGlobString = "";
							if (thetoday < 10)
							{
								thetoday = '0' + thetoday;
							}
							if (themonth < 10)
							{
								themonth = '0' + themonth;
							}
							var am = "AM";
							if (thehour > 11)
								am = "PM";
							if (thehour < 10)
								thehour = '0' + thehour;
							if (thehour > 12)
								thehour = thehour - 12;
							if (thehour == 0)
								thehour = 12;
							if (theminut < 10)
								theminut = '0' + theminut;

							var cdate = getCurrentDate() + " " + thehour + ':'
									+ theminut + " " + am;

							var cver = "Version : "
									+ sessionStorage.getItem("version");
							$('#CurrentDate').html(cdate);
							$('#CurrentVers').html(cver);

							if (window.devicePixelRatio > 1.5)
							{
								$("#mirnahlogo").attr('src',
										'images/towell-logo5.png');
								//	$("#gtrclogo").attr('src', 'images/GTRCLogobig.png');   
								if (sessionStorage.getItem("Division") == 'TUL FT OU')
								{
									$("#gtrclogo").attr('src',
											'images/ftlogo.png');
								} else
								{
									$("#gtrclogo").attr('src',
											'images/GTRCLogobig.png');
								}
							} else
							{

								if (sessionStorage.getItem("Division") == 'TUL FT OU')
								{
									$("#gtrclogo").attr('src',
											'images/ftlogo.png');
								} else
								{
									$("#gtrclogo").attr('src',
											'images/GTRCLogobig.png');
								}
							}
							//Fetch current language and set that language.
							window.lang = new jquery_lang_js();
							var lan = sessionStorage.getItem("Language");
							window.lang.run(lan);

							//Check for current language and set css for that
							if (sessionStorage.getItem("Language") != "en")
							{

								window.lang.change('Footer' + lan, lan);

								if (lan == "AR")
								{

									//Set html right alignment for arbic language
									$(".centerboxInvReq").attr("dir", "rtl");

									//Set menu icon with text
									$('#MenuListReview1 .ui-icon').removeClass(
											'ui-icon-arrow-r');
									$('#MenuListReview1 .ui-icon').addClass(
											'ui-icon-arrow-r1');
									$('li.ui-btn').removeClass(
											'ui-btn-icon-right');
									$('li.ui-btn').addClass('ui-btn-icon-left');

									//Set header align                    
									$('#Back_inner')
											.removeClass(
													'ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
									$('#Back_inner')
											.addClass(
													'ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
									$('#lang_inner')
											.removeClass(
													'ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
									$('#lang_inner')
											.addClass(
													'ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');

								}

							} else
							{

								//Change current language to english
								window.lang.change('en', 'en');

								//Set html left alignment for english language
								$(".centerboxInvReq").attr("dir", "ltr");

								//Set menu icon with text
								$('#MenuListReview1 .ui-icon').removeClass(
										'ui-icon-arrow-r1');
								$('#MenuListReview1 .ui-icon').addClass(
										'ui-icon-arrow-r');
								$('li.ui-btn').removeClass('ui-btn-icon-left');
								$('li.ui-btn').addClass('ui-btn-icon-right');

								//Set header align             
								$('#Back_inner')
										.removeClass(
												'ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
								$('#Back_inner')
										.addClass(
												'ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
								$('#lang_inner')
										.removeClass(
												'ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
								$('#lang_inner')
										.addClass(
												'ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');

							}

						});
	</script>
