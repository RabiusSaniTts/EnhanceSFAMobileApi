		 function deleteOrderstatus(data)
		 { //alert("deleteOrderstatus");
			 var Qry = "Delete from orderstatus";

	        //added for bulk inserting order data with single insert query ---
	        //Aswin Suresh 
	        //2025-09-03
		    function esc(val) {
		        if (val === null || val === undefined) return '';
		        return String(val).replace(/'/g, "''"); // escape single quotes
		    }

		    function processOrderstatus(data) {
		        data = JSON.parse(data);
		        if (!data["orderstatus"] || !data["orderstatus"].length) {
		            $.mobile.hidePageLoadingMsg();
		            return;
		        }

		        var records = data["orderstatus"];
		        var valuesArr = [];

		        for (var i = 0; i < records.length; i++) {
		            var rec = records[i];
		            var values = "(" +
		                "'" + esc(rec.routecode) + "'," +
		                "'" + esc(rec.salesmancode) + "'," +
		                "'" + esc(rec.customercode) + "'," +
		                "'" + esc(rec.customername) + "'," +
		                "'" + esc(rec.ordernumber) + "'," +
		                "'" + esc(rec.orderamount) + "'," +
		                "'" + esc(rec.orderdate) + "'," +
		                "'" + esc(rec.invoicenumber) + "'," +
		                "'" + esc(rec.invoiceamount) + "'," +
		                "'" + esc(rec.invoicedate) + "'," +
		                "'" + esc(rec.differenceamount) + "'," +
		                "'" + esc(rec.STATUS) + "'," +
		                "'" + esc(rec.alternatecode) + "'," +
		                "'" + esc(rec.alternateordernumber) + "'," +
		                "'" + esc(rec.alternateinvoicenumber) + "'," +
		                "'" + esc(rec.differencedate) + "'," +
		                "'" + esc(rec.ordercategory) + "'" +
		                ")";
		            valuesArr.push(values);
		        }

		        var Qry = "INSERT INTO orderstatus(" +
		            "routecode,salesmancode,customercode,customername,ordernumber,orderamount," +
		            "orderdate,invoicenumber,invoiceamount,invoicedate,differenceamount,STATUS," +
		            "alternatecode,alternateordernumber,alternateinvoicenumber,differencedate,ordercategory" +
		            ") VALUES " + valuesArr.join(",");

		        console.log("Executing Bulk Query:", Qry);

		        window.plugins.DataBaseHelper.insert(Qry, function(result) {
		            console.log("Bulk insert success");
		            getRecord1(); // only after all inserted
		        }, function(err) {
		            console.warn("Error inserting bulk orderstatus", err);
		            getRecord1(); // still call, so flow continues
		        });
		    }

					var qry ="SELECT os.routecode,salesmancode,os.customercode,os.customername,ordernumber,orderamount,orderdate,invoicenumber,invoiceamount,invoicedate,differenceamount,status,os.alternatecode,differencedate,ordercategory,cm.customeraddress1 from orderstatus os inner join customermaster cm on cm.customercode = os.customercode order by orderdate desc";

									},

			}
		 
		 	function ShowOderStatus(data, flag) {
			  $("#ordersContainer").empty();  // clear existing
			  
			  allOrders = data.array; //adding data to an array as global, Aswin Suresh on 2025-08-29
			  
			  // 1. create a Set to collect unique statuses
			  let statusSet = new Set();
			  let categorySet = new Set();

			  for (var i = 0; i < data.array.length; i++) {
			    var order = data.array[i];

			    var custname = order.customername;
			    var altcode = order.alternatecode;
			    var ordernum = order.ordernumber;
			    var orderdate = order.orderdate;
			    var orderamt = order.orderamount;
			    var invnum = order.invoicenumber;
			    var invdate = order.invoicedate;
			    var invamt = order.invoiceamount;
			    var diff = (order.orderamount - order.invoiceamount).toFixed(decimalplace);
			    var days = order.differencedate;
			    var status = order.status;
			    var ordercategory = order.ordercategory;
			    var customeraddress1 = order.customeraddress1;
			    
			    // collect this status into the Set
			    statusSet.add(status);
			    categorySet.add(ordercategory);

			    // map status to color + text
			    var statusLabel = "", statusClass = "badge-warning", cateClass = "badge-primary", cateLabel="";
			    //if (status === 0) { statusLabel = "Credit Stop"; statusClass = "badge-danger"; }
			    //if (status === 1) { statusLabel = "Invoiced"; statusClass = "badge-success"; }
			    //if (status === 2) { statusLabel = "Pending Delivery"; statusClass = "badge-warning"; }
			    statusLabel = status;
			    cateLabel = ordercategory;

			    var cardHtml = `
			      <div class="order-card">
			        <div class="order-header">
			          <span>${altcode} - ${customeraddress1}</span>
				          <div class="order-badges">
					          <span class="badge ${statusClass}">${statusLabel}</span>
					          <span class="badge ${cateClass}">${cateLabel}</span>
				          </div>
			        </div>
			        <div class="order-body">
			          <p><b>Order:</b> ${ordernum} | Date: ${orderdate} | Amount: ${orderamt}</p>
			          <p><b>Invoice:</b> ${invnum} | Date: ${invdate} | Amount: ${invamt}</p>
			          <p><b>Difference:</b> ${diff} | Days: ${days}</p>
			        </div>
			      </div>`;
			    
			    $("#ordersContainer").append(cardHtml);
			  }
			  
			  // 2. repopulate select box with distinct values
			  $("#statusFilter").empty(); // clear old
			  $("#statusFilter").append(`<option value="">All</option>`);

			  statusSet.forEach(function(stat) {
			    $("#statusFilter").append(`<option value="${stat}">${stat}</option>`);
			  });
			  
			  // 2. repopulate select box with distinct values
			  $("#categoryFilter").empty(); // clear old
			  $("#categoryFilter").append(`<option value="">All</option>`);

			  categorySet.forEach(function(cate) {
			    $("#categoryFilter").append(`<option value="${cate}">${cate}</option>`);
			  });
			  
			  
			  
			  $.mobile.hidePageLoadingMsg();
			}
		 
			function applyFilters(){
				
				var statusVal = $("#statusFilter").val();
				var catVal = $("#categoryFilter").val();
				var searchVal = $("#searchtext1").val().toLowerCase();
				
				let filtered = allOrders.filter(o => {
					let matchStatus = !statusVal || o.status == statusVal;
					let matchCat = !catVal || o.ordercategory == catVal;
					let matchSearch = !searchVal || 
					(o.customeraddress1 && o.customeraddress1.toLowerCase().includes(searchVal)) ||
					(o.alternatecode && o.alternatecode.toString().toLowerCase().includes(searchVal));
					return matchStatus && matchCat && matchSearch;
				});


				renderOrders(filtered);

			} 
			
			function renderOrders(orders) {
			$("#ordersContainer").empty();

				orders.forEach(order => {
					let diff = (order.orderamount - order.invoiceamount).toFixed(decimalplace);
					let statusLabel = order.status;
					let statusClass = "badge-warning"; // you can improve mapping
					let cateClass = "badge-primary";
					let cateLabel = order.ordercategory;

					let cardHtml = `
					<div class="order-card">
						<div class="order-header">
						<span>${order.alternatecode} - ${order.customeraddress1}</span>
						  <div class="order-badges">
						        <span class="badge ${statusClass}">${statusLabel}</span>
						        <span class="badge ${cateClass}">${cateLabel}</span>
					      </div>
						</div>
						<div class="order-body">
						<p><b>Order:</b> ${order.ordernumber} | Date: ${order.orderdate} | Amount: ${order.orderamount}</p>
						<p><b>Invoice:</b> ${order.invoicenumber} | Date: ${order.invoicedate} | Amount: ${order.invoiceamount}</p>
						<p><b>Difference:</b> ${diff} | Days: ${order.differencedate}</p>
						</div>
					</div>`;
					$("#ordersContainer").append(cardHtml);
				});
			} 

			
			function CheckIsNaN(val)
