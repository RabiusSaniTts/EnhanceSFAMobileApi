                          		}
                          		/*var url = window.location.toString();

	                                $("#ddlCustomer").val(custid);*/

                          	}

                function getCustomerCode()
                {
                    
                    if(localStorage.age == 'cust')
                    {
                        $("#ddlCustomer").attr("disabled",true);
                        customercode = sessionStorage.getItem("customerid");
                        $("#ddlCustomer").val(customercode);
                        $("#ddlCustomer").selectmenu("refresh");   
                    }
                    else
                    {
                        if($("#ddlCustomer").get(0).selectedIndex != 0)

                        else
                            customercode = "";
                    }
                    getCustomervalue(customercode);
                   
                }
                function getCustomervalue(ccode){
                
                	var Qry;                
                    Qry = "SELECT customercode,customername,alternatecode FROM customermaster WHERE customercode="+ccode;
                    console.log(Qry);
                    if(platform=="iPad")
                    {
                        Cordova.exec(function(result) 
                        { 
                          
                        },
                        function(error) {
                            navigator.notification.alert("Error in binding Customer : " + error);
                        },
                        "PluginClass", 
                        "GetdataMethod", 
                        [Qry]);         
            
                    }
                    else if(platform=="Android")
                    {
                        window.plugins.DataBaseHelper.select(Qry,function(result)
                        {
                        	if(result.array != undefined)
                        	{
		                    	result = $.map(result.array, function (item, index) {                
                					return [[item.customercode, item.customername,item.alternatecode]];
            					});
                        		if(result.length>0){
                        			$('#ccode').text("   "+result[0][2]);
                        			
                        		}
                          	}
                          	getRecord();
                        },
                        function()
                        {
                        console.warn("Error calling plugin");
                        });
                    } 
                	
                }
                function getRecord()
                { 
                	ClearTable('tbl1');                   
                    var Qry; 
                    if(customercode != "")
                        Qry = "SELECT invoicenumber,strftime('%d-%m-%Y',transactiondate) transactiondate,totalinvoiceamount,invoicebalance,ifnull(pdcbalance,0) pdcbalance,erpreferencenumber as erpnumber,remarks1 FROM customerinvoice WHERE  voidflag IS NOT 1 AND customercode = " + customercode +" ORDER BY strftime('%Y-%m-%d',duedate),invoicenumber";
                    else
                        Qry = "SELECT invoicenumber,strftime('%d-%m-%Y',transactiondate) transactiondate,totalinvoiceamount,invoicebalance,ifnull(pdcbalance,0) pdcbalance,erpreferencenumber as erpnumber,remarks1 FROM customerinvoice WHERE  voidflag IS NOT 1 ORDER BY strftime('%Y-%m-%d',duedate),invoicenumber";
                    console.log(Qry);
                    if(platform == "iPad")
                    {
                        Cordova.exec(function(result) {                        
                                BindData(result);
                        },
                        function(error) {
                            navigator.notification.alert(error);
                        },
                        "PluginClass",
                        "GetdataMethod",
                        [Qry]);
                    }
                    else if(platform == "Android")
                    {
                        window.plugins.DataBaseHelper.select(Qry, function(result) {
                        	if(result.array != undefined)
                        	{
                        		result = $.map(result.array, function (item, index) {                
	                        		return [[item.transactiondate,item.erpnumber,item.remarks1,item.invoicebalance,item.pdcbalance,item.totalinvoiceamount,item.invoicenumber]];
                    			});
                            	BindData(result);
                           	}
                        },
                        function() {
                            console.warn("Error calling plugin");
                        });
                    }
                }
                
                //Bind table data dynamically
            function BindData(result) 
            {   
                data = result;
               
                var CellCount = $("#tblHeaderContent tr:eq(0) th").length;
                for (i = 0; i < data.length; i++) 
                {
                    var r = "<tr class='contentFont'>";
                    for (j = 0; j < CellCount; j++) {                        
                        var temp = (j == 0) ? "class = leftAlign" : "class = rightAlign";
                        if(j == (CellCount - 1))
                        {
                            temp += " last";                            
                        }
                        var val;
                        val=data[i][j];
                        if(j==4){
                        	temp += " style='display:none;'";    
                        	
                        }
                        if(j > 2 && j<=5)
                           val = eval(val).toFixed(decimalplace);
//                        else if(j == 0)
//                        	val = data[i][5];
                        else if(j==5){
                        	val = data[i][6];
                        }
                            
                           
                            
                        if(val == 0)
                           val = parseInt(val); 
                        var c = "<td " + temp + ">" + val + "</td>";
                        r += c;
                    }
                    r += "</tr>";
                    $('#tbl1 tbody').append(r);
                }
                
               
                
                $("#tbl1 tr").live('click', function() {                    
                    $(this).toggleClass('clicked');
                    $(this).siblings().removeClass('clicked');
                    var i = $(this).index();
                  
                    invoicenumber = data[i-1][1];
                    if($(this).hasClass("clicked"))
                        selRow = true;
                    else
                        selRow = undefined;
                });
                
                $("#tbl1 tr:odd").addClass('oddRow');
                $("#tbl1 tr:even").addClass('evenRow');                 
                $("#tbl1 tr:eq(1)").trigger('click');
            }

                function ClearTable(tbl) {
                    $("#" + tbl + " tr:gt(0)").remove();
                    $("#" + tbl + " tr").die('click');
                    selRow = undefined;

                if (localStorage.age == 'cust') {

                   //$("#lnkPrint").attr("onclick", "localStorage.po='customer_opt'"); // org line sujee commented  03/07/2018

                $('.ui-btn-icon-notext').css({ 'margin-top': '19px !important' });
                $('.ui-input-datebox input').css({ 'width': '70% !important', 'color': '#999' });
                $('.ui-select .ui-btn-text').css({ 'text-align': 'left', 'color': '#fff' });
                $('.ui-input-text').css({

                $(".leftfooter").html(getCurrentDate());
                var lan = sessionStorage.getItem("Language");

                if (sessionStorage.getItem("Language") != "en") {

                    window.lang.change('Aginganalysis' + lan, lan);
                    window.lang.change('Footer' + lan, lan);
                    if (lan == "AR") {

                        $('#Back_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');

                    $('#Back_inner').addClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
                    $('#lang_inner').removeClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
                    $('#lang_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');

            	  var arr=[];
