		function updateTotalLineItemTax1() {
			var decimalplace = sessionStorage.getItem("decimalplace");
			if (decimalplace == null || decimalplace == undefined) {
				decimalplace = 3;
			}

			var Qry = "UPDATE invoiceheader set itemlinetaxamount =ROUND(((Select COALESCE(SUM(ROUND(salesitemexcisetax,"
					+ decimalplace
					+ ")),0) +COALESCE(SUM(ROUND(salesitemgsttax,"
					+ decimalplace
					+ ")),0)-COALESCE(SUM(ROUND(returnitemexcisetax,"
					+ decimalplace
					+ ")),0) -COALESCE(SUM(ROUND(returnitemgsttax,"
					+ decimalplace
					+ ")),0) -COALESCE(SUM(ROUND(damageditemexcisetax,"
					+ decimalplace
					+ ")),0)-COALESCE(SUM(ROUND(damageditemgsttax,"
					+ decimalplace
					+ ")),0) + COALESCE(SUM(ROUND(fgitemexcisetax,"
					+ decimalplace
					+ ")),0) +COALESCE(SUM(ROUND(fgitemgsttax,"
					+ decimalplace
					+ ")),0) +COALESCE(SUM(ROUND(promoitemexcisetax,"
					+ decimalplace
					+ ")),0) +COALESCE(SUM(ROUND(promoitemgsttax,"
					+ decimalplace
					+ ")),0) -COALESCE(SUM(ROUND(buybackexcisetax,"
					+ decimalplace
					+ ")),0) -COALESCE(SUM(ROUND(buybackgsttax,"
					+ decimalplace
					+ ")),0)  from invoicedetail "
					+ "where invoicedetail.routekey="
					+ sessionStorage.getItem('RouteKey')
					+ " and invoicedetail.visitkey="
					+ sessionStorage.getItem('VisitKey')
					+ ")),"
					+ decimalplace
					+ ")"
					+ "where routekey="
					+ sessionStorage.getItem('RouteKey')
					+ " and visitkey="
					+ sessionStorage.getItem('VisitKey');

			if (platform == 'Android') {
				window.plugins.DataBaseHelper.select(Qry, function(result) {
					updateInvoiceLevelTax1();

				}, function() {
					console.warn("Error calling plugin");
				});
			}
		}

		function updateInvoiceLevelTax1() {

			var Qry = "UPDATE invoiceheader set totaltaxesamount= (select taxAmount from "
					+ "(select cm.custtaxkey1,tm.taxtype,tm.taxpercentage,case when tm.taxtype=1 then "
					+ " ( (COALESCE(ih.totalsalesamount,0)-COALESCE(ih.totalpromoamount,0)+COALESCE(ih.itemlinetaxamount,0) +COALESCE(ih.diffround,0))*tm.taxpercentage/100)  else 0 END taxAmount "
					+ "from customermaster cm inner join taxmaster  tm on cm.custtaxkey1=tm.taxcode "
					+ "inner join invoiceheader ih on routekey="
					+ sessionStorage.getItem('RouteKey')
					+ " and visitkey="
					+ sessionStorage.getItem('VisitKey')
					+ " where  cm.customercode="
					+ sessionStorage.getItem('customerid')
					+ ") where routekey="
					+ sessionStorage.getItem('RouteKey')
					+ " and visitkey="
					+ sessionStorage.getItem('VisitKey')
					+ ")";

			if (platform == 'Android') {
				window.plugins.DataBaseHelper.select(Qry, function(result) {
					GetCashSetting();
					// alert("tax aupdated");
				}, function() {
					console.warn("Error calling plugin");
				});
			}
		}

		function CheckGCToCash() {

			var manualfree = window.localStorage.getItem("manualfree");
			var isreturn = window.localStorage.getItem("isreturn");
			if (eval(manualfree) > 0 && eval(isreturn) == 1) {
				window.location = '../customer_opt/Customer_manualfree.html';
			} else {

				if (localStorage.signature == "sales") {
					var lnkaccept = ""
					var allowgctocash = sessionStorage.getItem("allowgctocash");
					if (sessionStorage.getItem("invoicepaymentterms") == 2) {
						if (allowgctocash == 1) {
							var msg = "Do You Want To Make Payment ?";
							navigator.notification
									.confirm(
											msg,
											function(action) {
												if (action == true)
													window.location = '../customer_opt/cashcollection_mop.html';
												else
													window.location = '../review/printoption.html';

						} else
