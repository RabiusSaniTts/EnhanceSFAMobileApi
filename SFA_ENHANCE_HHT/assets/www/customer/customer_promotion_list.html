			function fillFreeList() {

				//alert(freeList.length);
				//alert(freeList[0][1]);
				//Free Promo Data
				Qry = " select t.promotionplannumber, im.alternatecode, im.itemdescription, t.promotionamount, "
				    + " ifnull(isd.loadqty,0)+ifnull(isd.loadadjustqty,0)+ifnull(isd.beginstockqty,0)+ifnull(isd.loadaddqty,0)-ifnull(isd.loadcutqty,0)-ifnull(isd.saleqty,0)+ifnull(isd.returnqty,0)+ifnull(isd.returnfreeqty,0)-ifnull(isd.freesampleqty,0) as availqty "
				    + " from PROMOTIONDETAIL_TEMP t inner join promoplandetail pd on t.promotionplannumber = pd.plannumber inner join productgroupdetail pgd on pd.assignmentgroup = pgd.groupnumber inner join itemmaster im on im.actualitemcode = pgd.itemcode "

			function updatePromo() {
				var promoList = '';
				var checkboxes = document.getElementsByName('selectedPromo');
				var checkboxesChecked = [];
				var jsonObj = [];
				// loop over them all
				const tableHead = document.getElementById('tblHeaderContent');
				for (var i = 0, j = 0; i < checkboxes.length; i++) {
					// And stick the checked ones onto an array...
					if (checkboxes[i].checked) {
						//checkboxesChecked.push(checkboxes[i]);
						checkboxesChecked[j] = tableHead.rows[i + 1].cells[2].textContent;
						//alert(j);
						//alert(checkboxesChecked[j]);
						promoList += checkboxes[i].value + ',';
						j++;
					}
				}
				for (let k = 0; k < freeList.length; k++) {
					freeList[k][2] = 0;
				}
				promoList = promoList.substring(0, promoList.length - 1);

				const tableMath = document.getElementById('tblHeaderFreeContent');

				for (let line = 1, qtyline = 0; line < tableMath.rows.length; line++, qtyline++) {
					var qtyid = "qty" + qtyline;
					var qty = document.getElementById(qtyid).value;
					if (qty != "") {
						var p = tableMath.rows[line].cells[0].textContent;
						var q = document.getElementById(qtyid).value;
						for (let k = 0; k < freeList.length; k++) {
							if (freeList[k][0] == p
									&& checkboxesChecked.includes(p)) {
								var a = +q;
								var b = +freeList[k][2]
								freeList[k][2] = a + b;
							}
						}
					}
				}
				var chk = 0;
				for (let k = 0; k < freeList.length; k++) {
					//alert("k-" + freeList[k][0]);
					if (checkboxesChecked.includes(freeList[k][0])) {
						//alert("Max-" + freeList[k][1]);
						//alert("Act-" + freeList[k][2]);
						if (freeList[k][1] != freeList[k][2]) {
							chk++;
						}
					} else {
						//alert('Not in List');
					}
				}
				//alert("Valid- " + chk);

				if (chk == 0) {
					$.mobile.showPageLoadingMsg();
					$('.ui-loader h1').text("Updating Invoice");
					var visitkey = sessionStorage.getItem("VisitKey");

					for (let line = 1, qtyline = 0; line < tableMath.rows.length; line++, qtyline++) 
					{
						var qtyid = "qty" + qtyline;
						var qty = document.getElementById(qtyid).value;
						if (qty != "")
						{
							var p = tableMath.rows[line].cells[1].textContent; //item code
							var q = document.getElementById(qtyid).value; // qty
							item = {}
					        item ["iCode"] = p;
					        item ["iQty"] = q;

					        jsonObj.push(item);
						}
					}
					
					plugins.WizzitIndent.pay(visitkey, promoList, jsonObj);
					setTimeout(function() {
						window.location = "signature.html";
					}, 4000);
				} else {
					alert('Qty Not matching for Free Promotion');
				}

			}
		</script>
