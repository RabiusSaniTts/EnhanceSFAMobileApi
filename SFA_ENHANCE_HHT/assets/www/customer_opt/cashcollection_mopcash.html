            function HasEntry(Link,Action,isExcess)
            {
                var AutoSettle = false;
                var Amount;
                if(objSettle)

                    transactiontype = 2;
                    if(eval(objSettle.aramount) > 0)
                        AutoSettle = true;
                    else
                        AutoSettle = false;
                }                
                else
                    transactiontype = 1;
                
                
                
                if(eval($("#txtCash").val()) == eval(sessionStorage.getItem("amountdue")) || (Math.abs(eval($("#txtCash").val())) >= Math.abs(eval(sessionStorage.getItem("minimumdue"))) && Math.abs(eval($("#txtCash").val())) <= Math.abs(eval(sessionStorage.getItem("amountdue")))) || eval($("#txtCash").val()) == 0 || (AutoSettle == true))
                {       
                    if(objSettle)
                    {
                    	if(isExcess && eval(objSettle.aramount) > 0){
                    		 Amount = $('#txtCash').val();
                    		 //(objSettle && Math.abs(eval($("#txtCash").val())) >= Math.abs(eval(sessionStorage.getItem("amountdue"))))

                    		 }else{
                    			 getLangText("Please enter exact amount or more amount");
                    			 return false;
                    		 }
                    		 
                    	}else{
                    		  if(eval($('#txtCash').val()) > eval(objSettle.aramount)){
                    			  Amount = objSettle.aramount;
                    		  }
                              else{
                            	  Amount = $('#txtCash').val();
                              }
                                 
                    		
                    		  if(localStorage.getItem("collectionMOP") == "autosettle" )
                              {
                                  if(GetAmountPaid() == false)
                                  {
                                      return false;
                                  }                        
                              }   
                    		  
                    	}
                    	
                    }
                    else
                        Amount = $('#txtCash').val();                    
                    
                                    
                        
                    var Qry;
                    if(Action > 0)
                    Qry = "UPDATE cashcheckdetail set amount=(" + eval(Amount) + "),checknumber=null,typecode=0,bankcode = null,issync=0 WHERE routekey=" + sessionStorage.getItem("RouteKey") + " and visitkey=" + sessionStorage.getItem("VisitKey")
                    else if(Action <=0)
                    Qry = "INSERT INTO cashcheckdetail(routekey,visitkey,typecode,amount,issync,transactiontype,paymenttype,istemp) VALUES(" + sessionStorage.getItem("RouteKey") + "," +sessionStorage.getItem("VisitKey") + ",0," + eval(Amount) + ",0," + transactiontype + "," + 2 + ",'true')";
                    console.log(Qry);
                    if(platform=='iPad')
                    {
                        Cordova.exec(function(result) 
                        {
                            if(localStorage.getItem("collectionMOP") == "autosettle")
                            {                                
                                    /*if(eval(localStorage.ARAmount) > 0)
                                        localStorage.ARAmount = eval(localStorage.ARAmount) + eval($("#txtCash").val());
                                    else*/
                                        localStorage.ARAmount = eval($("#txtCash").val());

                            else

                                window.location = base + Link;
                            }
                        },
                        function(error) {
                            alert(error);},
                        "PluginClass",
                        "InsertUpdateMethod",
                        [Qry]);   
                    }
                    else if(platform=='Android')
                    {
                        window.plugins.DataBaseHelper.insert(Qry,function(result)
                        {                        
                            if(localStorage.getItem("collectionMOP") == "autosettle")
                            {                                    
                                    localStorage.ARAmount = eval($("#txtCash").val());
                                    window.location = "cashcollection_mop.html";                             
                            }
                            else
                            {
                                var base = window.location.toString().substring(0, window.location.toString().lastIndexOf("/")) + "/";
                                window.location = base + Link;
