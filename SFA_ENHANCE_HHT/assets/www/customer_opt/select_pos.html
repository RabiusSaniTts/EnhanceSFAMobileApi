            <script type="text/javascript" language="javascript">
        window.lang = new jquery_lang_js();
	var platform= sessionStorage.getItem("platform");
                        var inputvalue='';
	$("#tbl1").click(function() { });
		
      resizeOrientationWindow();
	  $(document).ready(function() {
	 	resizeWindow();
        $(".leftfooter").html(getCurrentDate());
	     $('.ui-body-d').css({ 'background': '#fff' });
	    $('.ui-input-datebox').css({ 'width': '92%','line-height':'4.0' });
	    $('.ui-input-datebox input').css({'color':'#999' });
	   $('.ui-btn-icon-notext').css({ 'margin-top': '19px !important'});
            document.addEventListener("deviceready", getrecord, false);
	     $("#tbl1 tr:odd").addClass('oddRow');
        $("#tbl1 tr:even").addClass('evenRow');
	     $("#tbl1 tr").live('click', function() {
	    $(this).toggleClass('clicked');
	    $(this).siblings().removeClass('clicked');
	     var i=$(this).index();
	     
	      sessionStorage.setItem("posno", inputvalue[i][2]);
	      sessionStorage.setItem("posname", inputvalue[i][1]);
    });
            
            var lan = sessionStorage.getItem("Language");
		window.lang.run(lan);
		
                if (sessionStorage.getItem("Language")  != "en") {
               
                window.lang.change('selectPOS'+lan,lan);
                window.lang.change('Footer'+lan,lan);
		if(lan=="AR")
                {
                     $("#contentWrapper").attr("dir", "rtl");
                    $('#Back_inner').removeClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#Back_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').removeClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').addClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		}
		
		}
		else
		{
		    window.lang.change('en','en');
		    $(".contentWrapper").attr("dir", "ltr");
		    $('#Back_inner').removeClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#Back_inner').addClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').removeClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		}
        });
         function getrecord()
            {
	     
                var custid=sessionStorage.getItem("customerid");
                var routecode=sessionStorage.getItem("RouteCode");
                if(sessionStorage.getItem("Language")=='en')
                {
                    var qry = "select case WHEN "+sessionStorage.getItem("CheckCode")+" == 'alternatecode' THEN p.alternatecode ELSE p.itemcode END as alternatecode,p.itemdescription,p.itemcode  from posmaster as p where p.itemcode NOT IN( select itemcode from  customerposinventory where customercode="+custid+")";
              }
              else
              {
                 var qry = "select case WHEN "+sessionStorage.getItem("CheckCode")+" == 'alternatecode' THEN p.alternatecode ELSE p.itemcode END as alternatecode,p.arbitemdescription,p.itemcode from posmaster as p where p.itemcode NOT IN( select itemcode from  customerposinventory where customercode="+custid+")";
               
              }
                console.log(qry);
                if(platform=='iPad')
                {
                          Cordova.exec(function(result) {
                                    TableDataOffLine(result);
                          },
                          function(error) {
                          alert(error);},
                          "PluginClass", 
                          "GetdataMethod", 
                          [qry]);
                          
                }
                else if(platform=='Android')
           	{
			           		
                       window.plugins.DataBaseHelper.select(qry,function(result)
                       {
                              if(result.array != undefined)
			      {
                                    result = $.map(result.array, function (item, index) {   
                                    if(sessionStorage.getItem("Language")=='en')
                                    {
                                    return [[item.alternatecode,item.itemdescription,item.itemcode]];
                                    }
                                    else
                                    {
                                     return [[item.alternatecode,item.arbitemdescription,item.itemcode]];
                                    }
                                   
            		      });
                                     TableDataOffLine(result);
                              }
                              
                       },
                       function()
                       {
                        console.warn("Error calling plugin");
                       });
                    }
              }
	      function TableDataOffLine(RecSet)
            {
                var CellCount = $("#tblHeader tr:eq(0) td").length;
                
                inputvalue=RecSet;
                var data = RecSet;
                for (i = 0; i < data.length; i++) {
                    var r = "<tr>";
                   
                    for (j = 0; j < CellCount; j++) {
                        var temp = (j == 1) ? 'last' : '';
                      
                        var c = "<td width='33.3%' class='" + temp + "'>" + data[i][j] + "</td>";
                        r += c;
                    }
                    r += "</tr>";
                 
                    $('#tbl1 tbody').append(r);
                   // $('#tbl1 tr:first').toggleClass('clicked');
                }
            }
