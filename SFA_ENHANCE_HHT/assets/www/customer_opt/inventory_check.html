            //Function to fetch Items for sales from the database.
            function getRecord() {
                if (CaseEnabled) {
                    var Qry = "SELECT CASE WHEN '" + sessionStorage.getItem("Language") + "' = 'en' THEN itemdescription ELSE arbitemdescription END as Desc,(case when " + Qty + "=0 THEN '' ELSE (" + Qty + "/im.unitspercase) END) as cases,(case when " + Qty + "=0 THEN '' ELSE  (" + Qty + " % im.unitspercase) END) as units,im.caseprice,im.defaultsalesprice AS price,NULL as total,ifnull(customerinventorycheck.expiry_date,date()) as expiry_date,CASE WHEN '" + sessionStorage.getItem("CheckCode") + "' = 'alternatecode' THEN im.alternatecode ELSE im.actualitemcode END as Code,im.actualitemcode,im.unitspercase,im.caseprice FROM itemmaster AS im join customerinventorycheck on customerinventorycheck.itemcode = im.actualitemcode and customerinventorycheck.routekey=" + sessionStorage.getItem("RouteKey") + " and customerinventorycheck.visitkey=" + sessionStorage.getItem("VisitKey") + " and " + Qty + ">0 where im.itemtype=1 group by actualitemcode,expiry_date order by CASE printsequencecust WHEN 0 THEN 100000 ELSE printsequencecust END";

Key") + " AND visitkey=" + sessionStorage.getItem("VisitKey") + ") ORDER BY actualitemcode";

                 // sujee commented org qry 08/02/2018

R BY actualitemcode";

            // Salesinvoice grid data bind.

                        {

            // Calculating Total Cases and Total Units in grid.
            function GetCaseUnitTotal() {
                var TC = 0;
                var TU = 0;
                var C, U;
                for (i = 0; i < data.length; i++) {
                    if (CaseEnabled) {
                        C = eval($("#tblContent tr:eq(" + (i + 1) + ") td:eq(1)").text());
                        U = eval($("#tblContent tr:eq(" + (i + 1) + ") td:eq(2)").text());
                        if (C == undefined)
                            C = 0;
                        else
                            TC = TC + C;
                        if (U == undefined)
                            U = 0;
                        else
                            TU = TU + U;
                    }
                    else {
                        U = eval($("#tblContent tr:eq(" + (i + 1) + ") td:eq(1)").text());
                        if (U == undefined)
                            U = 0;
                        TU += eval(U);
                    }
                }
                return (TC + " / " + TU);
            }

            // Calculating Total Amount in grid.
            function GetTotalAmount() {
                var T;
                var Total = 0;
                for (i = 0; i < data.length; i++) {
                    if (CaseEnabled) {
                        T = eval($("#tblContent tr:eq(" + (i + 1) + ") td:eq(5)").text());
                    }
                    else {
                        T = eval($("#tblContent tr:eq(" + (i + 1) + ") td:eq(3)").text());
                    }

                    if (T == undefined)
                        T = 0;
                    else
                        Total = Total + T;
                }
                return Total.toFixed(decimalplace);
            }
