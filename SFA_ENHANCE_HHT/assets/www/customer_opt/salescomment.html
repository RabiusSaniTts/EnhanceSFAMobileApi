		function updateInv() {
			$("#ContLnk").hide();
			$.mobile.showPageLoadingMsg();
			$('.ui-loader h1').text("Updating Invoice");
			var visitkey = sessionStorage.getItem("VisitKey");
			//plugins.WizzitIndent.pay(visitkey, visitkey);
			plugins.WizzitIndent.viewpromo(visitkey, visitkey);

			//
			//alert('Updated');

			setTimeout(function() {
				getComment();
			}, 4000);
		}

		function getComment() {
			$("#ContLnk").show();
			document.getElementById("ContLnk").addEventListener('click',
					UpdateComment);

			platform = sessionStorage.getItem("platform");
			getPromotionSetting();
			if (platform == 'iPad') {
				Cordova
						.exec(
								function(result) {
									if (result.length > 0) {
										$("#txtComment").val(unescape(result));
									} else {
										$("#txtComment").val('');
									}
								},
								function(error) {
									navigator.notification
											.alert("Error updating record in salesman");
								},
								"PluginClass",
								"GetdataMethod",
								[ "select comments from invoiceheader where routekey = "
										+ sessionStorage.getItem("RouteKey")
										+ " and visitkey = "
										+ sessionStorage.getItem("VisitKey")
										+ " and customercode = "
										+ sessionStorage.getItem("customerid")
										+ "" ]);
			} else if (platform == 'Android') {

				window.plugins.DataBaseHelper.select(
						"select IFNULL(comments,'') comments from invoiceheader where routekey = "
								+ sessionStorage.getItem("RouteKey")
								+ " and visitkey = "
								+ sessionStorage.getItem("VisitKey")
								+ " and customercode = "
								+ sessionStorage.getItem("customerid") + "",
						function(result) {
							if (result.array != undefined) {
								var result = $.map(result.array, function(item,
										index) {
									return [ [ item.comments ] ];
								});
								if (result.length > 0) {
									$("#txtComment").val(unescape(result));
								} else
									$("#txtComment").val('');
							} else {
								$("#txtComment").val('');
							}
						}, function() {
							console.warn("Error calling plugin");
						});
			}
			$.mobile.hidePageLoadingMsg();
		}

		function getPromotionplan() {
			if (platform == 'iPad') {
				Cordova
						.exec(
								function(result) {

									promotionKeyplan = result[0][0];

								},
								function(error) {
									navigator.notification
											.alert("Error updating record in salesman");
								},
								"PluginClass",
								"GetdataMethod",
								[ "select count(*) as cnt from promokeydetail where promotionkey = "
										+ promotionKey + "" ]);
			} else if (platform == 'Android') {

				window.plugins.DataBaseHelper.select(
						"select count(*) as cnt from promokeydetail where promotionkey = "
								+ promotionKey + "", function(result) {
							var result = $.map(result.array, function(item,
									index) {
								return [ [ item.cnt ] ];
							});

							promotionKeyplan = result[0][0];

							console.log("promotionKeyplan---"
									+ promotionKeyplan);

						}, function() {
							console.warn("Error calling plugin");
						});
			}
		}
		function getPromotionSetting() {
			if (platform == 'iPad') {
				Cordova
						.exec(
								function(result) {
									if (result.length > 0) {
										promotionKey = result[0][0];
										enablePromotion = result[0][1];
										getPromotionplan();
									} else {
										promotionKey = 0;
										enablePromotion = 0;

									}
								},
								function(error) {
									navigator.notification
											.alert("Error updating record in salesman");
								},
								"PluginClass",
								"GetdataMethod",
								[ "select promotionkey,enableaddlpromoinvs from customermaster where customercode = "
										+ sessionStorage.getItem("customerid")
										+ "" ]);
			} else if (platform == 'Android') {

				window.plugins.DataBaseHelper
						.select(
								"select promotionkey,enableaddlpromoinvs from customermaster where customercode = "
										+ sessionStorage.getItem("customerid")
										+ "", function(result) {
									var result = $.map(result.array, function(
											item, index) {
										return [ [ item.promotionkey,
												item.enableaddlpromoinvs ] ];
									});

									if (result.length > 0) {
										promotionKey = result[0][0];
										enablePromotion = result[0][1];
										getPromotionplan();
									} else {
										promotionKey = 0;
										enablePromotion = 0;
									}
									console.log("enablePromotion---"
											+ enablePromotion);
									console.log("promotionKey---"
											+ promotionKey);
								}, function() {
									console.warn("Error calling plugin");
								});
			}
		}
