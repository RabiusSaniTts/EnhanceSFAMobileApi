            <script type="text/javascript" language="javascript">
            window.lang = new jquery_lang_js();
            var platform='';
            var inputvalue='';
            $("#tbl1").click(function() { });
            $(document).ready(function() {
                              platform= sessionStorage.getItem("platform");
                              document.addEventListener("deviceready", getCustomerList, false);
                             		
		
		    var page = 'merchandising.html';
		
		$("#Back_inner").attr("href", page);
      //  $("#exit").attr("href",page);

                $(".leftfooter").html(getCurrentDate());
                
                $('#tbl1 tr:first').toggleClass('clicked');
                $("#tbl1 tr").live('click', function() {
                    $(this).toggleClass('clicked');
                    $(this).siblings().removeClass('clicked');
                    var i = $(this).index();
                                   localStorage.visualcode=inputvalue[i][0];
                                   
                                   
                });
               
                var lan = sessionStorage.getItem("Language");
                              window.lang.run(lan);
		
                if (sessionStorage.getItem("Language")  != "en") {
               
                window.lang.change('Routebooks'+lan,lan);
                window.lang.change('Footer'+lan,lan);
		if(lan=="AR")
                {
                     $("#contentWrapper").attr("dir", "rtl");
                    $('#Back_inner').removeClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#Back_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').removeClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').addClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		}
		
		}
		else
		{
		    window.lang.change('en','en');
		    $("#contentWrapper").attr("dir", "ltr");
		    $('#Back_inner').removeClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#Back_inner').addClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').removeClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		}
            });
            //Function for bind customer list
            function getCustomerList()
            {
                var customercode = sessionStorage.getItem("customerid");
                if(platform=='iPad')
           		{ 
                    Cordova.exec(function(result) { 
                                  
                                   BindData(result); 
                                  },
                                  function(error) {
                                  alert("Error in binding Category : " + error);
                                  },
                                  "PluginClass", 
                                  "GetdataMethod", 
                                  ["select visualheader.visualcode,visualdescription from visualheader join customermaster on customermaster.visualcode=visualheader.visualcode where customercode="+customercode+"  order by visualheader.visualcode"]);         
                    
                }
             	else if(platform=='Android')
            	{
                    window.plugins.DataBaseHelper.select("select visualheader.visualcode,visualdescription,customercode from visualheader join customermaster on customermaster.visualcode=visualheader.visualcode where customercode="+customercode+"  order by visualheader.visualcode",function(result)
                                                         {		
                                                                      BindData(result);                                              
                                                         
                                                         },
                                                         function()
                                                         {
                                                         console.warn("Error calling plugin");
                                                         });
            	}
            }
            function BindData(result) {
                
                var CellCount = $("#tblHeaderContent tr:eq(0) td").length;
                
                if (platform == 'Android') {                    
                    var array = $.map(result.array, function(item, index) {
                                      
                                      return [[item.visualcode, item.visualdescription,item.customercode]];
                                      });
                    
                    data = array;
                }
                else
                {
                    data = result;
                }
                
                inputvalue=data;
                for (i = 0; i < data.length; i++) 
                {
                    var r = "<tr>";
                    if(data[i][2] == sessionStorage.getItem("customerid"))
                    {
                        var selectval = i;
                    
                    }
                    for (j = 0; j < CellCount; j++) {  
                        var c = '';
                        var temp = '';
                        
                        if (j == CellCount-1)
                        temp += " width='70%' class = 'last'";
                        
                        
                        c = "<td " + temp + ">" + data[i][j] + "</td>"; 
                        
                        
                        
                        r += c;
                    }
                    r += "</tr>";
                    
                    $('#tbl1 tbody').append(r);                    
                    
                }
                $("#tbl1 tr:eq("+selectval+")").trigger('click');
                $("#tbl1 tr:odd").addClass('oddRow');
                $("#tbl1 tr:even").addClass('evenRow');  
                
            }
             function savecustomercontrol()
        {
           
            var Qry = "Update customeroperationscontrol set totaltransactions = totaltransactions+1 where routekey = " + sessionStorage.getItem('RouteKey') + " and visitkey = " + sessionStorage.getItem('VisitKey') + " and customercode="+ sessionStorage.getItem('customerid')+" and routecode="+ sessionStorage.getItem('RouteCode');
            console.log(Qry);
            if(platform == "iPad")
            {
                Cordova.exec(function(result) {
                              	window.location = "merchandising.html";
                              },
                              function(error) {
                              navigator.notification.alert("Error save promtion detail record");
                              },
                              "PluginClass",
                              "InsertUpdateMethod",
                              [Qry]);
            }
            else if(platform == "Android")
            {
                window.plugins.DataBaseHelper.insert(Qry, function(result) {
                                                     	window.location = "merchandising.html";
                                                     },
                                                     function() {
                                                     console.warn("Error calling plugin");
                                                     });
            }
        }
