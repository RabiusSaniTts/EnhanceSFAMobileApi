            function GetCaseUnitTotal() {
                var TC = 0;
                var TU = 0;
                var C, U;
                for (i = 0; i < data.length; i++) {
                    if (CaseEnabled) {
                        C = eval($("#tbl1 tr:eq(" + (i + 1) + ") td:eq(2)").text());
                        U = eval($("#tbl1 tr:eq(" + (i + 1) + ") td:eq(3)").text());
                        if (C == undefined)
                            C = 0;
                        else
                            TC = TC + C;
                        if (U == undefined)
                            U = 0;
                        else
                            TU = TU + U;
                    }
                    else {
                        U = eval($("#tbl1 tr:eq(" + (i + 1) + ") td:eq(2)").text());
                        if (U == undefined)
                            U = 0;
                        TU += eval(U);
                    }
                }
                return (TC + " / " + TU);
            }
