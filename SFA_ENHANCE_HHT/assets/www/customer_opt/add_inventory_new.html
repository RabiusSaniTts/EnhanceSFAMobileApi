        function InsertTempDetail()
        {     
        	
        	//alert("InsertTempDetail");
             var cases = parseInt(CheckIsNaN($("#txtCase").val()));
            var units = parseInt(CheckIsNaN($("#txtUnits").val()));
            
	        var edate = $("#txtDate").val();
	        edate = edate.split("-");
	       
            var expiry = edate[2] + "-" + edate[1] + "-" + edate[0];
            var currqty = eval((cases * UPC)) + eval(units);
           
            var Qry = "Insert Into tempcustomerinventory(routekey,visitkey,itemcode,alternatecode,customercode,quantity,expirydate,barcode,issync,entryflag,routecode,salesmancode) values(" + sessionStorage.getItem('RouteKey') + "," + sessionStorage.getItem('VisitKey') + "," + rpitemno  + ",'"+sessionStorage.getItem('itmCode')+"',"+sessionStorage.getItem("customerid")+"," + currqty + ",'"+expiry+"','"+barcode+"',0,1,"+sessionStorage.getItem("RouteCode")+","+sessionStorage.getItem("SalesmanCode")+")";
            console.log(Qry);
          // alert(Qry);
            if(platform=='iPad')
		    {                
                Cordova.exec(function(result)
                {
                    ClearVariables(1);
                },
                function(error) {
                    navigator.notification.alert("Error inserting record in a invoice detail");
                },
                "PluginClass",
                "InsertUpdateMethod",
                [Qry]);
            }
            else if(platform=='Android')
           	{
                window.plugins.DataBaseHelper.insert(Qry, function(result)
                {
                	CheckInvoiceDetailItemCount();
                   // ClearVariables(1);
                },
                function()
                {
                    console.warn("Error calling plugin");
                });
            } 
        }
        function CheckInvoiceDetailItemCount()
        {
	    
	       var edate = $("#txtDate").val();
            if(platform=='iPad')
		    {
            Cordova.exec(function(result) {
                            if(result.length > 0)
                            {
                                UPC = result[0][1];                                
                                if(result[0][0] == 0)
                                {   
                                    if($("#txtCase").val() == '')
                                        $("#txtCase").val(0);
                                    if($("#txtUnits").val() == '')
                                        $("#txtUnits").val(0);
                                    InsertInvoiceDetail();
                                }
                                else
                                {   
                                    UPC = result[0][1];                                    
                                    if($("#txtCase").val() == '')
                                        $("#txtCase").val(0);
                                    if($("#txtUnits").val() == '')
                                        $("#txtUnits").val(0);
                                    UpdateInvoiceDetail();
                                }
                            }
                          },
                          function(error) {
                            navigator.notification.alert("Error in check invoice detail item count : " + error);
                          },
                          "PluginClass", 
                          "GetdataMethod", 
                          ["Select Count(routekey) as routekey,(SELECT unitspercase FROM itemmaster WHERE actualitemcode = " + itemno + ") unitspercase From customerinventorycheck where routekey = "+ sessionStorage.getItem('RouteKey') +" and visitkey = "+ sessionStorage.getItem('VisitKey') +" and istemp = 'false' and itemcode = "+ itemno +" and expiry_date='"+edate+"'"]);    
       		}
       		else if(platform=='Android')
           	{
       			
	           		window.plugins.DataBaseHelper.select("Select Count(routekey) as routekey,(SELECT unitspercase FROM itemmaster WHERE actualitemcode = " + sessionStorage.getItem("rpItmCode") + ") unitspercase From customerinventorycheck where routekey = "+ sessionStorage.getItem('RouteKey') +" and visitkey = "+ sessionStorage.getItem('VisitKey') +" and istemp = 'false' and itemcode = "+ rpitemno +" and expiry_date='"+edate+"'",function(result)
					{
						if(result.array != undefined)
						{
		                    result = $.map(result.array, function (item, index) {
                				return [[item.routekey,item.unitspercase]];
            				});
		                   
		                  	if(result.length > 0)
                            {
                                UPC = result[0][1];                                
                                if(result[0][0] == 0)
                                {   
                                    if($("#txtCase").val() == '')
                                        $("#txtCase").val(0);
                                    if($("#txtUnits").val() == '')
                                        $("#txtUnits").val(0);
                                    InsertInvoiceDetail();
                                }
                                else
                                {   
                                    UPC = result[0][1];                                    
                                    if($("#txtCase").val() == '')
                                        $("#txtCase").val(0);
                                    if($("#txtUnits").val() == '')
                                        $("#txtUnits").val(0);
                                    UpdateInvoiceDetail();
                                }
                            }
                         }                
					},
					function()
					{
				   	 console.warn("Error calling plugin");
					});
           	} 
        }
        

        function InsertInvoiceDetail()
        {       
        	
            var cases = parseInt(CheckIsNaN($("#txtCase").val()));
            var units = parseInt(CheckIsNaN($("#txtUnits").val()));
	        var edate = $("#txtDate").val();
	        edate = edate.split("-");
            
            var expiry = edate[2] + "-" + edate[1] + "-" + edate[0];
            var currqty = eval((cases * UPC)) + eval(units);
           
            var Qry = "Insert Into customerinventorycheck(routekey,visitkey,itemcode," + Qty + ",issync,istemp,expiry_date) values(" + sessionStorage.getItem('RouteKey') + "," + sessionStorage.getItem('VisitKey') + "," +sessionStorage.getItem("rpItmCode")+ "," + currqty + ",0,'false','"+expiry+"')";
            console.log(Qry);
            //alert(Qry);
            if(platform=='iPad')
		    {                
                Cordova.exec(function(result)
                {
                    ClearVariables(0);
                },
                function(error) {
                    navigator.notification.alert("Error inserting record in a invoice detail");

                "PluginClass",
                "InsertUpdateMethod",
                [Qry]);
            }
            else if(platform=='Android')
           	{
                window.plugins.DataBaseHelper.insert(Qry, function(result)

                    ClearVariables(1);
                },
                function()
                {
                    console.warn("Error calling plugin");
                });
            } 
        }
        
       function UpdateInvoiceDetail()
        {      
    	  
                var cases = parseInt(CheckIsNaN($("#txtCase").val()));
                var units = parseInt(CheckIsNaN($("#txtUnits").val()));
                var currqty = eval((cases * UPC)) + eval(units);
		        var edate = $("#txtDate").val();
		        edate = edate.split("-");
	            
	            var expiry = edate[2] + "-" + edate[1] + "-" + edate[0];
                var Qry = "Update customerinventorycheck set " + Qty  + " =  (ifnull(" + Qty  + ",0) + " + CurrQty + "),issync=0,istemp='false',expiry_date='"+expiry+"' where routekey = " + sessionStorage.getItem('RouteKey') + " and visitkey = " + sessionStorage.getItem('VisitKey') + " and itemcode = " + sessionStorage.getItem("rpItmCode")+" and expiry_date='"+edate+"'";
                console.log(Qry);
               // alert(Qry);
                if(platform=='iPad')
		    	{                   
                	Cordova.exec(function(result)
                    {
                        ClearVariables(0);
                    },
                    function(error) {
                        navigator.notification.alert("Error updating record in a invoice detail");
                    },
                    "PluginClass",
                    "InsertUpdateMethod",
                    [Qry]);                              
            	}
            	else if(platform=='Android')
           	  	{
           	  	    window.plugins.DataBaseHelper.insert(Qry, function(result)
					{
           	  	        
                        ClearVariables(1);
					},
					function()
					{
				   	 console.warn("Error calling plugin");
					});
           	 	}
        }
        
        function ClearVariables(act)
        {
            $("#itemno").val("");
            $("#txtCase").val("");
            $("#txtUnits").val("");
	        $("#txtDate").val("");
            $("#lblDesc").text("");           
            sessionStorage.setItem("ItemCode","");
            sessionStorage.setItem("ItemDesc","");
            sessionStorage.setItem("itemno","");
            sessionStorage.setItem("rpItmCode","");
            sessionStorage.setItem("itmDes","");
            sessionStorage.setItem("itmCode","");
            //localStorage.removeItem("addshelf");
            if(act == 1)
                window.location = "DistributionCheck_New.html";
        }  
       
        function GetUPC()
        {
            var Qry = "SELECT unitspercase,barcode1 FROM itemmaster WHERE actualitemcode = " + sessionStorage.getItem("rpItmCode");
            console.log(Qry);
            if (platform == "iPad") {
                    Cordova.exec(function(result) {
                        UPC = result[0][0];
                    },
                    function(error) {
                        navigator.notification.alert(error);
                    },
                    "PluginClass",
                    "GetdataMethod",
                    [Qry]);
            }
            else if (platform == "Android") {
                    window.plugins.DataBaseHelper.select(Qry, function(result) {
                    	UPC = result.array[0].unitspercase;
                    	barcode = result.array[0].barcode1;
                    	if(eval(UPC)==1){
                    		    $("#txtCase").textinput("disable");
                    		   
                    		   
                    		   
                    	}else{
	                    		$("#txtCase").textinput("enable");
	                		   
	                		    
                    	}      
                    	
                    	
                    },
				    function() {
				        console.warn("Error calling plugin");
				    });
            }
        }
        
        
        function CheckIsNaN(val)
        {
      
            if(isNaN(val))
            return 0;
            else
            return val;
        }  
        
        function SetFormat(obj)
        {
            var Num = new Number($(obj).val());            
            $(obj).val(parseInt(Num));
        }
