        <script type="text/javascript" language="javascript">
        window.lang = new jquery_lang_js();
        $(document).ready(function() {

        $(".leftfooter").html(getCurrentDate());
                          
                          if (localStorage.invoice == 'order') {
                          var page = 'orderRequest.html';
                          localStorage.enable=0;
                          
                          }
                          else if (localStorage.invoice == 'salesbadreturn') {
                          var page = 'salesbadreturn.html';
                          localStorage.enable=1;
                          
                          }
                          else if (localStorage.invoice == 'salesgoodreturn') {
                          var page = 'salesgoodreturn.html';
                          localStorage.enable=1;
                          }
                          else if (localStorage.invoice == 'salesrental') {
                          var page = 'salesrental.html';
                          localStorage.enable=0;
                          }
                          else if (localStorage.invoice == 'buybackfree') {
                          var page = 'salesgoodreturn.html';
                          localStorage.enable=1;
                          }
                          else if (localStorage.invoice == 'salesemptycontainers') {
                          var page = 'salesemptycontainers.html';
                          localStorage.enable=0;
                          }
                          else if (localStorage.invoice == 'inventory') {
                          var page = '../customer/customer_inventory.html';
                          localStorage.enable=0;
                          }
                          else {
                          var page = 'salesinvoice.html';
                          localStorage.enable=0;
                          }
                          if(localStorage.invoice =='sales' || localStorage.invoice =='salesgoodreturn')
                          {
                                $('#lbldis').removeClass('MenuGray');
                                $('#imgdis').attr('src', '../images/info-7.png');
                                $('#disc').attr('href', 'itemdiscount.html');
                          }
                          else
                          {
                                $('#lbldis').addClass('MenuGray');
                                $('#imgdis').attr('src', '../images/info-7_g.png');
                                $('#disc').attr('href', '');
                          }
                           document.addEventListener("deviceready", getsetting, false);
        
                $("#Back_inner").attr("href", page);
		$("#exit").attr("href", page);
		
            var lan = sessionStorage.getItem("Language");
		window.lang.run(lan);
		
                if (sessionStorage.getItem("Language")  != "en") {
               
                window.lang.change('InvoiceOptions'+lan,lan);
                window.lang.change('Footer'+lan,lan);
		if(lan=="AR")
                {
                      $('#MenuList .ui-icon').removeClass('ui-icon-arrow-r');
                    $('#MenuList .ui-icon').addClass('ui-icon-arrow-r1');
                    $('#MenuList li.ui-btn').removeClass('ui-btn-icon-right');
                    $('#MenuList li.ui-btn').addClass('ui-btn-icon-left');
                    $('#Back_inner').removeClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#Back_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').removeClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').addClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		}
		
		}
		else
		{
		    window.lang.change('en','en');
		     $('#MenuList .ui-icon').removeClass('ui-icon-arrow-r1');
                    $('#MenuList .ui-icon').addClass('ui-icon-arrow-r');
                    $('#MenuList li.ui-btn').removeClass('ui-btn-icon-left');
                    $('#MenuList li.ui-btn').addClass('ui-btn-icon-right');
		    $('#Back_inner').removeClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#Back_inner').addClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').removeClass('ui-btn-left ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		    $('#lang_inner').addClass('ui-btn-right ui-btn ui-btn-corner-all ui-shadow ui-btn-up-a');
		}


        });
        function getsetting()
        {
            getdiscountsetting();
            var qry = "select status from controlpanel where flagid = 1";
            console.log(qry);
            var platform= sessionStorage.getItem("platform");
            if(platform=='iPad')
            {
                Cordova.exec(function(result) {                           
                              if(eval(result[0][0]) == 0)
                              {
                              $('#lblbatch').addClass('MenuGray');
                              $('#imgbatch').attr('src', '../images/batch-gray.png');
                              $('#batchlink').attr('onclick', '');
                              $('#batchlink').attr('href', '');
                              }
                              },
                              function(error) {
                              navigator.notification.alert("Error in binding promotion list : " + error);
                              },
                              "PluginClass", 
                              "GetdataMethod", 
                              [qry]);         
            }
            else if(platform=='Android')
            {          
                window.plugins.DataBaseHelper.select(qry,function(result)
                                                     {
                                                     if(eval(result.array[0].status) == 0)
                                                     {
                                                     $('#lblbatch').addClass('MenuGray');
                                                     $('#imgbatch').attr('src', '../images/batch-gray.png');
                                                     $('#batchlink').attr('onclick', '');
                                                     $('#batchlink').attr('href', '');
                                                     }
                                                     
                                                     },
                                                     function()
                                                     {
                                                     console.warn("Error calling plugin");
                                                     });
            }    
        }
        function getdiscountsetting()
        {
            var platform= sessionStorage.getItem("platform");
            var qry="select c.discountkey from discountkeydetail AS d JOIN customermaster AS c ON c.discountkey=d.discountkey where c.customercode="+sessionStorage.getItem("customerid");
            console.log(qry);
            if(platform=='iPad')
            {
                Cordova.exec(function(result) {                           
                              if(result=='')
                              {
                              $('#lbldis').addClass('MenuGray');
                              $('#imgdis').attr('src', '../images/info-7_g.png');
                              $('#disc').attr('href', '');
                              }
                              },
                              function(error) {
                              navigator.notification.alert("Error in binding promotion list : " + error);
                              },
                              "PluginClass", 
                              "GetdataMethod", 
                              [qry]);         
            }
            else if(platform=='Android')
            {          
                window.plugins.DataBaseHelper.select(qry,function(result)
                                                     {
                                                     if($.isEmptyObject(result))
                                                     {
                                                     $('#lbldis').addClass('MenuGray');
                                                     $('#imgdis').attr('src', '../images/info-7_g.png');
                                                     $('#disc').attr('href', '');
                                                     }
                                                     
                                                     },
                                                     function()
                                                     {
                                                     console.warn("Error calling plugin");
                                                     });
            }  
        }
    </script>
